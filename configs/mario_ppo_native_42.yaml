# 4-2 run l (2026-09-19): run k + the backward curriculum (Go-Explore phase 2 on the agent's own route): once a
# door->warp route is known (the first clear with a recorded action prefix), 75% of resets start on it in
# [tau*, tau*+32] and tau* steps back 16 when >= 20% of the last 64 band starts warp. Run k at epoch 2500: 0/446
# door episodes and 0/302 restarts at x 512-1023 reached the warp area; 53% of all steps loitered at the level end.
# 4-2 run k (2026-09-19): run j's code after the 2026-09-18/19 review (EXPERIMENTS.md); config changes = the fixes only:
# life_loss_reset (a life loss is a fresh draw: 43% of run j's steps were continued lives, 27% respawned at x 1576 behind
# the vine / coin-cache pipe, all labelled door), learnability frontier weights (16 never-converted cells took 59% of the
# frontier restarts), value_norm_clip 20 (the warp's return sat at 6.4 sd, above the +-5 sd clamp), minibatch shuffling,
# and the env fixes (no reward on death steps, sub-area frames, no cutoff on a level-change step, archive hygiene).
# Archives of earlier runs use other cell keys: start from scratch. Mac: add --minibatch-size 1024 (MPS aborts).
# 4-2 run j (2026-09-17): run i (9.5 h, epoch ~3500) never cleared from the door. Probes of its policy: from warp-area winners
# 8% warp, ~half the episodes still wandering after 700 steps collecting ~856 novelty bonus (door episodes never reach the
# warp area, so every cell there paid +100 per life); one change: cell_bonus_door_only. Launch on a Mac with
# --minibatch-size 1024 (run i logged 69 MPS command-buffer aborts at 4096).
# 4-2 run i (2026-09-16 23:05): run h's frontier practice was starved: explorer wins sat in cell_wins against policy-only
# tries (79 of 340 winners never tried, all 16 frontier slots on old heavily practised cells); explorer wins are now a
# separate count, untried proven winners get the top practice weight, winning cells are never pruned, the archive is
# saved at exit. Config unchanged apart from the name and archive file.
# 4-2 run h (2026-09-16): run g was stopped after ~15 min by a reward review. Discounted returns of a found vine route
# vs a found flag run (a wrong exit) from the decision point (x >= 1000), novelty bonus excluded: at gamma 0.995 /
# per_extra 100 the flag was worth MORE (1034 vs 884): the rest of the main level pays ~2250 px of progress at once, the
# +1900 comes ~300 steps later. gamma 0.998 + per_extra 300 (warp 4700): vine 3291 vs flag 1685. cell_max_variants
# 3 -> 8: within 50 epochs explorers filled the floor spot under the vine brick with 3 revealed-hidden-block /
# broken-brick signatures in every camera bin; mid-bump ($23) states are no longer archived at all.
# 4-2 run g (2026-09-16, same config on the GPU box and on a Mac): random walks moved OUT of the training envs
# into invisible explorer cores (explorer_envs: rl_games trained the substituted random actions as the policy's
# own), the archive only saves 4-2 states (8-x cells after the warp were archived and practised), the paid warp
# into 8-1 ends the episode (end_on_stage_exit), and the tile-variant cap no longer counts camera bins as variants.
# device cuda:0 falls back to mps on a Mac (device_support.py); n_threads is clamped to the core count.
# 4-2 ONLY, from scratch (2026-09-12): the vine warp to 8-1 is the only clear (+1900); the flag and the world-5 pipe are wrong exits. Discovery variant + a longer unpaid cutoff (the vine chain is ~250 unpaid steps for a human) and explorer episodes back on, and EVERY restart from a fresh cell (< 10 uses) is a random walk (Go-Explore's explore-from-new-cells; the on-top-of-the-revealed-block cell is where UP must meet the vine); restarts 60% (the door episodes already run the whole level). Base: tile-aware 32-px archive cells (a revealed block / a pipe top is its own cell and earns the relative novelty bonus), the 2-D first-visit cell reward (+2 per new 64x32 cell per life), explorer episodes OFF (rl_games trains substituted random actions as the policy's own), frontier restarts drawn per level (winners only). Otherwise routeDet: restarts 30%, frontier 50%, bonus 100.
# Route run v2: full toolbox (eps-floor, global novelty, score reward,
# persistent archive). Eval: sequential full game from 1-1.
params:
  seed: 42
  algo: {name: a2c_discrete}
  model: {name: discrete_a2c}
  network:
    name: actor_critic
    separate: false
    space: {discrete: null}
    cnn:
      type: conv2d
      activation: elu
      initializer: {name: orthogonal_initializer, gain: 1.41421356237}
      convs:
      - {filters: 32, kernel_size: 8, strides: 4, padding: 0}
      - {filters: 64, kernel_size: 4, strides: 2, padding: 0}
      - {filters: 64, kernel_size: 3, strides: 1, padding: 0}
    mlp:
      units: [512]
      activation: elu
      initializer: {name: orthogonal_initializer, gain: 1.41421356237}
  config:
    name: Mario_PPO42l
    env_name: mario_native
    score_to_win: 100000
    normalize_value: true
    normalize_input: false
    reward_shaper: {scale_value: 0.01}
    normalize_advantage: true
    gamma: 0.998
    tau: 0.95
    learning_rate: 0.00025
    lr_schedule: adaptive
    kl_threshold: 0.008
    grad_norm: 0.5
    entropy_coef: 0.02
    truncate_grads: true
    e_clip: 0.1
    clip_value: true
    num_actors: 128
    horizon_length: 128
    minibatch_size: 4096
    # rl_games patches (rlg_patches.py): shuffle every mini-epoch (rl_games kept the same whole-trajectory blocks), and the
    # value normaliser's clamp at 20 sd instead of 5 (the 4700 warp = 47 scaled sat above the 5-sd ceiling, 37.5 in run j)
    shuffle_minibatches: true
    value_norm_clip: 20
    mini_epochs: 4
    critic_coef: 0.5
    max_epochs: 200000
    use_diagnostics: true
    save_frequency: 500
    save_best_after: 500
    print_stats: true
    device: cuda:0
    multi_gpu: false
    stage_curriculum_freq: 20
    env_config:
      name: SuperMarioBros-v0
      action_type: complex
      episode_life: true
      # reward set v2 -- see mario_ppo_native_84.yaml for the rationale
      # a backward teleport ends the episode at the same time-sized cost as
      # every other failure (a non-terminal loop let the door policy quit into
      # the cheap loop instead of attempting the hidden block: clean-eval loops
      # went 9% -> 97% within 90 minutes)
      full_game: true
      reward:
        - {type: first_visit_progress, cap: 20}
        - {type: level_clear, base: 500, per_extra: 300}
        - {type: first_visit_cells, bonus: 2, x_bin: 64, y_bin: 32}
      unpaid_timeout: 500
      page_reset_grace: 60
      page_reset_px: 600
      skip: 4
      sticky_actions: 0.0
      reset_noops: 0
      random_stages: [4-2]
      route_levels: [1-1, 1-2, 4-1, 4-2, 8-1, 8-2, 8-3, 8-4]
      self_restart_prob: 0.6
      # backward-chaining frontier (the mechanism that consolidated 8-4's
      # late cells): half of the restarts go to the least-practised cells
      # that already produced a level advance. Off-route exits no longer
      # count, so in 1-2 the winners are warp-zone/ceiling cells and the
      # band chains back toward the ceiling entry.
      self_restart_frontier_prob: 0.5
      self_restart_frontier_k: 16
      n_threads: 24
      self_restart_cells: 16384
      # a level change off route_levels (4-2 flag -> 4-3, world-5 pipe) is a wrong exit: the episode ends and every
      # leaving step pays 0 (rewards are positive-only)
      explore_eps: 0.0
      explore_episode_prob: 0.05
      # the vine chain is three fresh cells at 10% / 7% / 16% per walk: 40 walks each -> ~95% per link
      explore_fresh_uses: 60
      # 300-step walks: the ledge is reached in ~1-3% of 300-step random walks from the top row / platform cells
      explore_episode_steps: 300
      # pure random persistent actions in explorer walks (the default 60% policy / 40% macro mix runs right
      # with the policy and leaves the cell within a few steps; a local search needs to stay put)
      explore_pure: true
      # invisible explorer cores: the random walks run outside the training envs (their actions and rewards never
      # reach PPO) from the least-walked archive cells, fresh cells (< explore_fresh_uses walks) first; with
      # explorers on, training envs never walk (explore_fresh_uses steers the explorers; explore_episode_prob has no
      # effect then)
      # (M2 Max, 128 actors: 64 explorers ~1750 fps total, 128 explorers ~1650 -- twice the walks for ~7%)
      explorer_envs: 128
      # the paid route exit ends the episode (the warp into 8-1 used to play on into 8-1)
      end_on_stage_exit: true
      # every life loss ends the game too and the next episode is a fresh draw (door or archive restart); the default
      life_loss_reset: true
      cell_bonus: 100
      cell_bonus_relative: true
      # novelty for door episodes only: restarts in the warp area farmed the bonus instead of warping
      cell_bonus_door_only: true
      # backward curriculum (tests/demo_bench.py): share of resets on the route, draw width, band / step size, band
      # success rate to step back, band window
      demo_start_prob: 0.75
      demo_window: 32
      demo_step: 16
      demo_success: 0.2
      demo_success_n: 64
      # 32-px x-bins: at 64 px the ledge under the hidden block (x 1030-1050, y 96) and the platform next to it
      # (x 1055-1070, y 112) were ONE cell, so the ledge -- the only spot a random walk bumps the block from
      # (10% per 150-step walk; 0% from the platform) -- never got its own archive state
      cell_x_bin: 32
      # 16-px y-bands: the ledge (y 96) and the platform (y 112) shared a 32-px band, so the ledge never became a cell
      cell_y_band: 16
      # camera position in the cell key: the block is only bumpable while it is still on screen
      cell_screen_bin: 64
      cell_tiles: true
      cell_max_variants: 8
      frontier_per_level: true
      archive_path: native/archive_42l.pkl
      # up to ~16k cells x 4 savestates: persist every 3 min, not every minute
      archive_save_secs: 180
    player: {render: false, games_num: 10, deterministic: true, n_game_life: 3}
    eval_env_config:
      backend: native   # eval starts from the same native door states as training (lockstep seeded from the reference emulator: other frame counter/RNG/timer)
      full_game: true
      # per-level clips (GIF per level in TB + mp4) at every video epoch,
      # each played until the level is cleared or the lives are gone
      random_stages: [4-2]
      video_levels: [4-2]
